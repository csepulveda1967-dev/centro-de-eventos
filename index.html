<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVI Flow · Gestión Integral de Eventos | CS Consultoría</title>
    <meta name="description" content="SOLVI Flow: Software de gestión integral de centros de eventos y productoras. «Todo fluye. Todo conecta». Desarrollado por CS Consultoría." />
    <meta property="og:title" content="SOLVI Flow · Gestión Integral de Eventos" />
    <meta property="og:description" content="Toda la operación de una empresa de eventos en una sola plataforma: cotizador, escandallo gastronómico, compras y calendario. «Todo fluye. Todo conecta». CS Consultoría." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Layout impecable de cabecera y tabs como en el despliegue de Netlify */
      header > div > div {
        flex-wrap: wrap;
        height: auto !important;
        min-height: 68px;
        padding-top: 12px;
        padding-bottom: 12px;
        row-gap: 10px;
      }
      header nav {
        order: 3;
        flex: 1 0 100%;
        width: 100%;
        max-width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        overflow: visible;
        gap: 6px;
        padding: 6px;
        background-color: #f1f5f9;
        border-radius: 14px;
      }
      header nav button {
        flex: 0 0 auto;
        justify-content: center;
        padding: 9px 16px !important;
        font-size: 13px !important;
        border-radius: 10px !important;
      }
      header > div > div > div:last-child {
        flex-wrap: wrap;
        justify-content: flex-end;
        flex-shrink: 1;
        row-gap: 6px;
      }
      @media (max-width: 920px) {
        header { position: static; }
        header nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
        header nav button { width: 100%; }
      }
      @media (max-width: 640px) {
        header > div > div { padding-top: 8px; padding-bottom: 8px; }
        header nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        header nav button { width: 100%; min-width: 0; padding: 10px 4px !important; }
      }
      @media (max-width: 400px) {
        header nav button { white-space: normal !important; line-height: 1.15 !important; font-size: 12px !important; }
      }
      /* 1. Ocultar el banner del Spot Comercial si está presente */
      .bg-gradient-to-r.from-slate-900.via-amber-950.to-slate-900,
      [title="Ver presentación publicitaria con voz en off interactiva"] {
        display: none !important;
      }

      /* 2. Corregir y limpiar los iconos para eliminar los bloques negros gigantes */
      svg, [class*="icon"], [class*="lucide"], .bi, 
      header div div div img, main img,
      div[class*="rounded"] > div:first-child:has(svg) {
        background-color: transparent !important;
        color: #b45309 !important;
        fill: none !important;
        border: none !important;
      }
      .w-12.h-12.bg-black, .w-16.h-16.bg-black, div:has(> svg) {
        background-color: #fef3c7 !important;
        color: #b45309 !important;
        border-radius: 12px !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
